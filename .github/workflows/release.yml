name: Release

# Run it from the Actions tab (or `gh workflow run release.yml -f bump=minor`).
# It checks the card, raises the version, commits and tags that, and publishes
# a GitHub release with the card attached, which is what HACS installs.
#
# Versions run 0.01, 0.02 … 0.99, 1.00, 1.01 … and the tag and release carry
# exactly that number, with no "v" in front.
#   minor  adds 0.01 (and rolls 0.99 over to 1.00)
#   major  goes to the next whole number (0.37 → 1.00, 1.05 → 2.00)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "minor: 0.01 → 0.02, 0.99 → 1.00. major: 0.37 → 1.00."
        type: choice
        options:
          - minor
          - major
        default: minor

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Releases are cut from the default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Run this workflow on $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          previous="$(node .github/scripts/version.mjs current)"
          version="$(node .github/scripts/version.mjs bump "$BUMP")"
          # The tag and the release are named with the bare number: 0.01, not v0.01.
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "### $previous → $version ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Release $TAG"
          git tag "$TAG"
          # Both or neither: if the branch moved since this run started, nothing is pushed.
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/door-lock-card.js --title "$TAG" --generate-notes --latest --verify-tag
